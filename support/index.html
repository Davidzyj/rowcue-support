<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RowCue — independent Apple Watch row counter. Privacy policy and support in English, Chinese and Japanese."><title>RowCue — support</title><link rel="icon" href="../app-icon.png"><link rel="stylesheet" href="../style.css"></head><body><header><a class="brand" data-page="home" href="../">RowCue / 行间</a><nav aria-label="Navigation"><a data-page="home" data-label="home" href="../">Home</a><a data-page="privacy" data-label="privacy" href="../privacy/">Privacy policy</a><a data-page="support" data-label="support" href="../support/">Support</a></nav></header><main><div class="languages" aria-label="Language"><a data-language="en" href="?lang=en">English</a><a data-language="zh-Hans" href="?lang=zh-Hans">简体中文</a><a data-language="ja" href="?lang=ja">日本語</a></div><div class="hero"><img src="../app-icon.png" alt="RowCue app icon" width="96" height="96"><h1 id="title">Support</h1><p id="intro">Last updated: October 29, 2026</p></div><div id="sections"></div><a class="contact" href="mailto:jay212315@gmail.com" data-label="email">Contact the developer</a><p><a href="mailto:jay212315@gmail.com">jay212315@gmail.com</a></p><noscript><p>Enable JavaScript to switch languages. Contact jay212315@gmail.com for a copy of the privacy policy or support information.</p><section><h2>Start a project</h2><p>Tap New project, choose a type, and optionally enter a name. Set the number of fully completed rows; leave it at zero for a new piece. Optionally add a pattern repeat or a row cue.</p></section><section><h2>Count a row</h2><p>The large number is the row you are about to work. Only tap Row complete after finishing the entire row. “Completed” shows the rows already done. A partially finished row and its individual stitches are not tracked.</p></section><section><h2>Repeats and row cues</h2><p>Set rows per repeat to track your position in a repeating pattern. For a decrease every six rows starting at row six, set First cue at row to 6 and Repeat every to 6. The cue appears before working row 6, 12, 18, and so on. Follow your own pattern for stitch counts and techniques.</p></section><section><h2>Fix an accidental tap</h2><p>Tap Undo on the counter screen. The previous progress change is reversed, together with the repeat position and row cue. Up to 200 recent progress changes per project are retained for undo. Undo does not restore deleted projects or earlier project settings.</p></section><section><h2>Unravel or correct progress</h2><p>Open the … project menu. Use Frog back to subtract unraveled completed rows, or Adjust progress to enter the correct number of fully completed rows. Review the destination row before confirming. Both changes can be undone.</p></section><section><h2>Pause, resume, and archive</h2><p>Progress saves after each successful change. Reopening the app resumes the last active project. Return to the project list to switch projects. Archive finished pieces to keep them without clutter; restore them from Archived. Deleting a project requires confirmation and cannot be undone.</p></section><section><h2>Watch-face shortcut</h2><p>Add the RowCue complication to a compatible watch face. Tap it to open the last active project. It is a launcher; it does not display live row counts on the watch face. Available positions depend on the watch face.</p></section><section><h2>Language and haptics</h2><p>Open Settings to choose System, English, Simplified Chinese, or Japanese. Haptic feedback can be switched off there. Touch feedback and wrist visibility also depend on your watch’s settings.</p></section><section><h2>Data safety</h2><p>RowCue has no app-operated cloud sync or export feature. Do not treat it as your only copy of a critical pattern or project record. If a saved file is damaged, the app may restore the preceding local copy and ask you to check the count. If neither copy can be read, original files are preserved and editing is blocked.</p></section><section><h2>Purchases and refunds</h2><p>RowCue is designed for a one-time App Store purchase. The price and availability are shown by the App Store. Apple handles payments, purchase history, and refund requests. Purchase access does not restore local project data.</p></section><section><h2>Get help or report a bug</h2><p>Email jay212315@gmail.com. Include your watch model, watchOS version, RowCue version, and the steps that led to the issue. A screenshot is helpful if you are comfortable sharing it. Do not include passwords or payment information.</p></section></noscript></main><footer><p>© 2026 RowCue. Apple Watch is a trademark of Apple Inc.</p><p><a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub privacy statement</a> · <a href="https://reportaproblem.apple.com/">Apple purchase support</a></p></footer><script>const CONTENT={"en": {"name": "RowCue", "tagline": "Keep your place. Enjoy every row.", "intro": "A small, independent Apple Watch companion for knitting and crochet. Track completed rows, pattern repeats, and the next row that needs your attention.", "home": "Home", "privacy": "Privacy policy", "support": "Support", "updated": "Last updated: October 29, 2026", "email": "Contact the developer", "switch": "Language", "home_sections": [["A quiet companion on your wrist", "Create a project, finish a row, and tap Row complete. RowCue keeps completed rows separate from the row you are about to work."], ["Made for real-life pauses", "Return to your last project, undo accidental taps, or move back after unraveling. Optional repeat tracking and row cues follow your progress together."], ["Only on Apple Watch", "Works independently on Apple Watch with watchOS 10 or later. No iPhone companion app, account, ads, subscriptions, or app-operated cloud service. English, Simplified Chinese, and Japanese are included."], ["Manual by design", "RowCue does not automatically detect stitches or rows, read health data, or understand a pattern. Row cues appear when you manually reach a configured row; they are not scheduled notifications."]], "privacy_sections": [["Overview", "RowCue is a local-first Apple Watch app. The app does not collect, transmit, sell, or share your project data, and does not include advertising, analytics, tracking SDKs, or user accounts."], ["Data stored on your watch", "Project names, project types, completed rows, repeat and row-cue rules, recent progress changes, language choice, haptic preference, and the last active project are saved in the app’s local storage. They are used only to provide the app’s features. A previous saved copy is kept locally to help recover from a damaged file."], ["Permissions and connectivity", "The app does not request access to Health, contacts, location, microphone, camera, or notifications. RowCue does not operate a server or provide cloud synchronization. A watch-face complication opens the app and does not transmit your progress."], ["Retention and deletion", "Project data remains locally until you delete the project or remove the app. Deleting a project removes it from the active data file; a previous local recovery copy may retain it until a subsequent successful save replaces that copy. Removing the app may remove local data. Device loss, reset, or storage damage may cause data loss. Any operating-system backup or device transfer is controlled by Apple and your device settings; RowCue does not guarantee backup or recovery."], ["Support correspondence", "If you choose to email jay212315@gmail.com, the developer receives the email address and information you include. This information is used to respond to your request. Avoid including sensitive information. Email is handled by the email providers involved. The app does not send support messages automatically."], ["This website and third parties", "These support pages are hosted on GitHub Pages. GitHub may process standard request information, including IP addresses, under its own privacy statement. This site uses no analytics, tracking cookies, third-party fonts, or advertising. A language parameter in the URL selects the page language; no language preference cookie is stored. Following an external link is subject to that service’s policy."], ["Children and changes", "The app does not knowingly collect personal information from children or other users. This policy will be updated if the app’s data practices change. The date above identifies the current version."], ["Contact", "Questions about privacy or deletion of support correspondence: jay212315@gmail.com."]], "support_sections": [["Start a project", "Tap New project, choose a type, and optionally enter a name. Set the number of fully completed rows; leave it at zero for a new piece. Optionally add a pattern repeat or a row cue."], ["Count a row", "The large number is the row you are about to work. Only tap Row complete after finishing the entire row. “Completed” shows the rows already done. A partially finished row and its individual stitches are not tracked."], ["Repeats and row cues", "Set rows per repeat to track your position in a repeating pattern. For a decrease every six rows starting at row six, set First cue at row to 6 and Repeat every to 6. The cue appears before working row 6, 12, 18, and so on. Follow your own pattern for stitch counts and techniques."], ["Fix an accidental tap", "Tap Undo on the counter screen. The previous progress change is reversed, together with the repeat position and row cue. Up to 200 recent progress changes per project are retained for undo. Undo does not restore deleted projects or earlier project settings."], ["Unravel or correct progress", "Open the … project menu. Use Frog back to subtract unraveled completed rows, or Adjust progress to enter the correct number of fully completed rows. Review the destination row before confirming. Both changes can be undone."], ["Pause, resume, and archive", "Progress saves after each successful change. Reopening the app resumes the last active project. Return to the project list to switch projects. Archive finished pieces to keep them without clutter; restore them from Archived. Deleting a project requires confirmation and cannot be undone."], ["Watch-face shortcut", "Add the RowCue complication to a compatible watch face. Tap it to open the last active project. It is a launcher; it does not display live row counts on the watch face. Available positions depend on the watch face."], ["Language and haptics", "Open Settings to choose System, English, Simplified Chinese, or Japanese. Haptic feedback can be switched off there. Touch feedback and wrist visibility also depend on your watch’s settings."], ["Data safety", "RowCue has no app-operated cloud sync or export feature. Do not treat it as your only copy of a critical pattern or project record. If a saved file is damaged, the app may restore the preceding local copy and ask you to check the count. If neither copy can be read, original files are preserved and editing is blocked."], ["Purchases and refunds", "RowCue is designed for a one-time App Store purchase. The price and availability are shown by the App Store. Apple handles payments, purchase history, and refund requests. Purchase access does not restore local project data."], ["Get help or report a bug", "Email jay212315@gmail.com. Include your watch model, watchOS version, RowCue version, and the steps that led to the issue. A screenshot is helpful if you are comfortable sharing it. Do not include passwords or payment information."]]}, "zh-Hans": {"name": "行间 · RowCue", "tagline": "记住每一行，安心接着织。", "intro": "独立运行在 Apple Watch 上的编织与钩针进度助手。记录已完成行数、花样循环，以及当前行的关键操作。", "home": "首页", "privacy": "隐私政策", "support": "技术支持", "updated": "更新日期：2026 年 10 月 29 日", "email": "联系开发者", "switch": "语言", "home_sections": [["手腕上的安静帮手", "创建作品，完整织完一行，再点“本行完成”。明确区分已完成行数和当前要织的那一行。"], ["随时放下，也能继续", "重新打开上次的作品，撤销误点，或在拆线后回退进度。花样循环和关键行提醒跟随进度一起变化。"], ["只为 Apple Watch", "支持 watchOS 10 及以上，可脱离 iPhone 配套应用独立使用。无账号、广告、订阅和应用自建云服务。支持简体中文、英语、日语。"], ["手动记录，明确可靠", "不会自动识别针数、行数或图解，不读取健康数据。关键行提醒在手动推进到对应行时显示，并非定时通知。"]], "privacy_sections": [["概述", "行间（RowCue）是一款以本地存储为主的 Apple Watch 应用。应用不收集、传输、出售或共享您的作品数据，不包含广告、统计分析、跟踪 SDK 或用户账号。"], ["保存在手表上的数据", "作品名称与类型、已完成行数、花样循环和关键行规则、最近进度操作、语言选择、触觉偏好及最近使用的作品，保存在应用本地空间，仅用于提供应用功能。本机还保留一份之前保存的副本，用于文件损坏时尝试恢复。"], ["权限与网络", "应用不申请健康、通讯录、位置、麦克风、相机或通知权限，不提供自建服务器或云同步。表盘复杂功能用于打开应用，不传输作品进度。"], ["保留与删除", "作品数据保留在本机，直到您删除作品或移除应用。删除作品会从当前数据文件移除该作品；上一份本地恢复副本可能暂时保留，直到后续成功保存替换该副本。卸载应用可能清除本地数据。设备丢失、重置或存储损坏可能造成数据丢失。系统备份和设备迁移由 Apple 及设备设置控制，本应用不保证备份或恢复。"], ["技术支持邮件", "如果您主动向 jay212315@gmail.com 发送邮件，开发者会收到您的邮箱地址和您提供的信息，仅用于处理咨询。请不要发送敏感信息。邮件由相关邮件服务商处理，应用不会自动发送支持邮件。"], ["本网站与第三方", "隐私和支持页面托管于 GitHub Pages。GitHub 可能依据其隐私声明处理 IP 地址等常规请求信息。本网站不使用统计分析、跟踪 Cookie、第三方字体或广告。页面语言由网址参数选择，不设置语言偏好 Cookie。访问外部链接时，适用该服务的政策。"], ["儿童与政策变更", "应用不会有意收集儿童或其他用户的个人信息。如果数据处理方式变化，将更新本政策。页首日期标识当前版本。"], ["联系", "如有隐私问题，或希望删除技术支持往来信息，请联系 jay212315@gmail.com。"]], "support_sections": [["创建作品", "点“新建作品”，选择类型，可选填名称。填写已经完全织好的行数，新作品保持为 0。按需开启花样循环或关键行提醒。"], ["记录一行", "大数字表示当前要织的那一行。完整织完这一行后，再点“本行完成”。“已完成”表示已经织好的行数。不记录一行内部的针数或半行进度。"], ["花样循环与关键行", "设置每个循环的行数，即可查看当前处于第几轮、第几行。如果从第 6 行开始，每 6 行减针一次，将首次提醒设置为 6，间隔设置为 6。应用会在准备织第 6、12、18 行时提示。具体针法和针数仍以您的图解为准。"], ["点错了怎么办", "在计数页面点“撤销”，恢复上一次进度变化，循环位置与提醒一并恢复。每个作品保留最近最多 200 次进度操作用于撤销。撤销无法恢复已删除作品，也不用于撤销作品设置修改。"], ["拆线或校正进度", "打开作品的“…”菜单。“拆线回退”用于扣除拆掉的完整行数；“调整进度”用于直接设置正确的已完成行数。确认前请核对即将回到的行数。这两种进度变更都可以撤销。"], ["暂停、继续与归档", "每次变更成功后都会保存。重新打开会继续最近的未归档作品，返回列表可以切换作品。完成的作品可归档，在“已归档”中恢复。删除需要确认，且无法撤销。"], ["表盘快捷入口", "在支持的位置添加 RowCue 复杂功能，点一下即可打开上次的作品。这是启动入口，不在表盘上实时显示行数。可用位置取决于所选表盘。"], ["语言与触觉", "在设置中选择跟随系统、简体中文、English 或日本語，也可关闭触觉反馈。触觉和抬腕显示体验同时受手表系统设置影响。"], ["数据安全", "应用不提供自建云同步和导出功能，重要图解和作品进度建议另留记录。文件损坏时，应用可能恢复上一份本地副本并提示核对行数；若两份记录都无法读取，会保留原文件并阻止覆盖。"], ["购买与退款", "应用按 App Store 一次性购买方式设计，实际价格和可用情况以商店展示为准。支付、购买记录和退款由 Apple 处理。恢复购买资格不等于恢复本地作品数据。"], ["反馈问题", "请发送邮件至 jay212315@gmail.com，附上手表型号、watchOS 版本、应用版本和复现步骤。方便时可提供截图，请勿发送密码或支付信息。"]]}, "ja": {"name": "RowCue", "tagline": "編みかけの続きは、いつもここに。", "intro": "Apple Watchだけで使える、棒針編み・かぎ針編みの進捗アプリ。完成した段数、模様の繰り返し、次の段の作業を手元に残せます。", "home": "ホーム", "privacy": "プライバシーポリシー", "support": "サポート", "updated": "更新日：2026年10月29日", "email": "開発者に問い合わせる", "switch": "言語", "home_sections": [["手元の小さな相棒", "プロジェクトを作り、1段編み終えたら「この段が完成」をタップ。完成した段と、これから編む段をはっきり区別します。"], ["ひと休みしても大丈夫", "前回のプロジェクトから再開できます。誤操作の取り消しや、ほどいた段数の修正にも対応。繰り返しとリマインダーも一緒に戻ります。"], ["Apple Watch専用", "watchOS 10以降に対応。iPhone用アプリなしで独立して動作します。アカウント、広告、定期購読、アプリ独自のクラウドサービスはありません。日本語、英語、簡体字中国語に対応。"], ["手動で、わかりやすく", "目数や段数、編み図を自動認識せず、ヘルスケアのデータも読み取りません。お知らせは手動で設定した段に進んだ時に表示され、時刻による通知ではありません。"]], "privacy_sections": [["概要", "RowCueはApple Watchに記録を保存するアプリです。プロジェクトデータを収集、送信、販売、共有しません。広告、アクセス解析、追跡SDK、ユーザーアカウントは含まれません。"], ["Watchに保存する情報", "名前、種類、完成段数、模様の繰り返しと段のリマインダー設定、最近の進捗操作、言語、触覚の設定、最後に使用したプロジェクトをアプリ内に保存します。アプリの機能のためだけに使用し、ファイル破損時の復元用として前回の保存データも端末内に保持します。"], ["権限と通信", "ヘルスケア、連絡先、位置情報、マイク、カメラ、通知へのアクセスは要求しません。独自のサーバーやクラウド同期は提供しません。文字盤のコンプリケーションはアプリを開くためのもので、進捗を送信しません。"], ["保存期間と削除", "プロジェクトやアプリを削除するまで記録は端末内に保存されます。プロジェクトの削除で現在の記録からは消えますが、前回の復元用コピーには、次の正常な保存で置き換わるまで残る場合があります。アプリの削除、端末の紛失、初期化、ストレージの破損でデータが失われる場合があります。OSのバックアップや移行はAppleと端末設定により管理され、RowCueは復元を保証しません。"], ["お問い合わせメール", "jay212315@gmail.comにメールを送った場合、開発者はメールアドレスと記載内容を受け取り、対応のために使用します。機密情報は送らないでください。メールは関係するメールサービスで処理されます。アプリが自動でメールを送ることはありません。"], ["このサイトと第三者サービス", "このサイトはGitHub Pagesで公開しています。GitHubは独自のプライバシーステートメントに基づき、IPアドレスなど通常のリクエスト情報を処理する場合があります。このサイトは解析、追跡Cookie、外部フォント、広告を使いません。言語はURLのパラメータで選択し、言語設定Cookieは保存しません。外部リンク先には各サービスのポリシーが適用されます。"], ["お子様とポリシーの変更", "お子様や他の利用者の個人情報を意図的に収集しません。データの取り扱いが変わる場合は本ポリシーを更新し、上記の日付で版を示します。"], ["連絡先", "プライバシーに関するご質問やお問い合わせ履歴の削除依頼：jay212315@gmail.com。"]], "support_sections": [["プロジェクトを作る", "「新規プロジェクト」で種類を選び、必要に応じて名前を入力します。すでに編み終えた段数を設定し、新しい作品は0のままにします。模様の繰り返しや段のリマインダーも任意で設定できます。"], ["1段を記録する", "大きな数字はこれから編む段です。1段をすべて編み終えてから「この段が完成」をタップしてください。「完成した段」は編み終えた段数です。段の途中の目数は記録しません。"], ["繰り返しとリマインダー", "1回の模様の段数を設定すると、何回目の何段目か確認できます。6段目から6段ごとに減らし目をする場合、最初の段を6、間隔を6に設定します。6、12、18段目を編み始める前に表示します。編み方や目数は編み図で確認してください。"], ["誤ってタップしたとき", "カウンター画面の「元に戻す」で前の進捗操作を取り消します。繰り返しとリマインダーも戻ります。1作品につき直近200件まで取り消し用に保持します。削除した作品や設定変更は復元できません。"], ["ほどいたとき・段数の修正", "「…」メニューを開きます。「ほどいて戻す」はほどいた完成段数を引き、「進み具合を修正」は正しい完成段数を直接設定します。戻る段を確認してから保存してください。どちらも取り消せます。"], ["中断・再開・アーカイブ", "変更が正常に保存されるたびに記録されます。再起動すると最後の制作中プロジェクトに戻ります。一覧から作品を切り替えられます。完成品はアーカイブでき、後から再開できます。削除は確認が必要で、取り消せません。"], ["文字盤のショートカット", "対応する文字盤にRowCueのコンプリケーションを追加すると、前回の作品を開けます。起動用の機能で、文字盤に段数をリアルタイム表示しません。配置できる場所は文字盤により異なります。"], ["言語と触覚", "設定からシステム設定、English、简体中文、日本語を選べます。触覚フィードバックもオフにできます。触覚や手首を上げた際の表示はWatch本体の設定にも依存します。"], ["記録の安全性", "独自のクラウド同期や書き出し機能はありません。重要な編み図や進捗は別にも控えてください。保存ファイルが壊れた場合は前回の端末内コピーから復元し、段数の確認をお願いする場合があります。両方とも読めない場合は元のファイルを保持し、上書きを防ぎます。"], ["購入と返金", "App Storeでの買い切りを想定したアプリです。価格と提供状況はストアで確認してください。支払い、購入履歴、返金はAppleが管理します。購入資格の復元で端末内の作品データは戻りません。"], ["不具合・お問い合わせ", "jay212315@gmail.comまで、Watchのモデル、watchOSのバージョン、アプリのバージョン、問題の再現手順をお送りください。可能ならスクリーンショットも役立ちます。パスワードや支払い情報は送らないでください。"]]}};const PAGE="support";const BASE="../";const D=CONTENT;const query=new URLSearchParams(location.search).get('lang');const auto=navigator.language.startsWith('zh')?'zh-Hans':navigator.language.startsWith('ja')?'ja':'en';const lang=D[query]?query:auto;const t=D[lang];document.documentElement.lang=lang;const page=PAGE;document.title=t[page==='home'?'name':page]+' · RowCue';document.querySelectorAll('[data-label]').forEach(el=>el.textContent=t[el.dataset.label]);document.querySelectorAll('[data-page]').forEach(el=>{el.href=BASE+(el.dataset.page==='home'?'':el.dataset.page+'/')+'?lang='+lang});document.querySelectorAll('[data-language]').forEach(el=>{el.href='?lang='+el.dataset.language;el.setAttribute('aria-current',el.dataset.language===lang)});const title=document.getElementById('title');title.textContent=page==='home'?t.tagline:t[page];document.getElementById('intro').textContent=page==='home'?t.intro:t.updated;const main=document.getElementById('sections');t[page+'_sections'].forEach(([heading,body])=>{const section=document.createElement('section');const h=document.createElement('h2');h.textContent=heading;const p=document.createElement('p');p.textContent=body;section.append(h,p);main.append(section)});</script></body></html>
